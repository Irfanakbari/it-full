name: CI and Docker Publish

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: it-full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"
  IMAGE_NAME: it-full

jobs:
  validate:
    name: Validate ITAM workspace
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:itam-disposable-only@127.0.0.1:56837/itam_ci
      NODE_OPTIONS: --experimental-vm-modules
      LICENSE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: itam-disposable-only
          POSTGRES_DB: itam_ci
        ports: ["56837:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6387:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Prepare disposable integration database
        run: pnpm --filter @itam/api exec prisma migrate deploy

      - name: Lint API
        run: pnpm lint:api

      - name: Test API
        run: pnpm test:api

      - name: Run API integration tests
        run: pnpm test:e2e:api

      - name: Build API
        run: pnpm build:api

      - name: Lint web
        run: pnpm lint:web

      - name: Test web
        run: pnpm --filter @itam/web test

      - name: Build web
        run: pnpm --dir apps/web exec next build --webpack

  publish:
    name: Publish ITAM container
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            environment="production"
          else
            environment="staging"
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.environment }}
          cache-from: type=gha,scope=it-full
          cache-to: type=gha,mode=max,scope=it-full
